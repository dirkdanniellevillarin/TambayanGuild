spring.application.name=tambayan-guild

# Database connection settings
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/tambayan_guild?createDatabaseIfNotExist=true
spring.datasource.username=tambayan
spring.datasource.password=tambayan123

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update

# Server settings
server.port=8081
server.error.include-stacktrace=never

# Session based login and local Vite development proxy.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=12h
