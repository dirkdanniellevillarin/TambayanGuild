# XAMPP MySQL must be running, and the tambayan_guild database must exist.
spring.application.name=tambayan-guild
spring.datasource.url=jdbc:mysql://localhost:3306/tambayan_guild?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Taipei
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Create/update tables to match the JPA entities during development.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
